name: Nightly pipeline

# Ingest → drift check → retrain on drift → score lots → rebuild DuckDB
on:
  schedule:
    - cron: "30 20 * * *"   # 02:00 IST
  workflow_dispatch:
    inputs:
      force_train:
        description: "Retrain even without drift"
        type: boolean
        default: false

jobs:
  pipeline:
    runs-on: ubuntu-latest
    env:
      OPENWEATHER_API_KEY: ${{ secrets.OPENWEATHER_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: python pipeline.py ${{ inputs.force_train && '--force-train' || '' }}
      - name: Job summary
        run: |
          echo '### PISA nightly run' >> "$GITHUB_STEP_SUMMARY"
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          cat reports/pipeline_run.json >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: pisa-run-${{ github.run_number }}
          path: |
            reports/
            models/
            mlflow.db
            mlartifacts/
          retention-days: 14
