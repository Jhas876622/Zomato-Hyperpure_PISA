# Copy to .streamlit/secrets.toml (git-ignored) or paste into Streamlit Cloud → App settings → Secrets.
# Never commit the real secrets to GitHub.

# ── LLM for "Ask PISA" (one is enough) ───────────────────────
GROQ_API_KEY = "gsk_your_groq_api_key_here"


# ── SSO login (remove this whole section to run in open demo mode) ──
# Google example. For Microsoft Entra ID use
#   https://login.microsoftonline.com/<tenant-id>/v2.0/.well-known/openid-configuration
[auth]
redirect_uri = "http://localhost:8502/oauth2callback"   # your deployed URL + /oauth2callback
cookie_secret = "generate_with_python_secrets_token_hex_32"
client_id = "YOUR_GOOGLE_CLIENT_ID.apps.googleusercontent.com"
client_secret = "YOUR_GOOGLE_CLIENT_SECRET"
server_metadata_url = "https://accounts.google.com/.well-known/openid-configuration"

# ── Who may see what ─────────────────────────────────────────
[access]
admins = ["your-email@gmail.com"]              # all hubs + Ask PISA
viewers = ["analyst@company.com"]              # all hubs, no Ask PISA
allow_any_viewer = true                        # true = any verified Google login becomes a viewer

[access.hub_managers]                          # warehouse_id = [emails]; they see only that hub
WH_DEL_01 = ["delhi.manager@company.com"]
WH_MUM_01 = ["mumbai.manager@company.com"]
WH_BLR_01 = ["bangalore.manager@company.com"]
