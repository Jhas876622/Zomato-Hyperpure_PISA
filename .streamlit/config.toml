# PISA "cold-room desk" theme — frosted light / cold-room navy dark.
# Hyperpure red is the brand + interaction color; in charts it only ever means "critical".

[theme]
base = "light"
primaryColor = "#CB202D"
backgroundColor = "#F2F5F7"
secondaryBackgroundColor = "#E4EAEE"
textColor = "#142029"
borderColor = "#D3DCE2"
baseRadius = "small"
showSidebarBorder = true
font = "sans serif"

[theme.dark]
primaryColor = "#E5414D"
backgroundColor = "#0E1922"
secondaryBackgroundColor = "#172631"
textColor = "#E4ECF1"
borderColor = "#24384A"
redColor = "#E5414D"
orangeColor = "#EE8A3A"
yellowColor = "#D9B444"
greenColor = "#4DA67E"
blueColor = "#5DB0CF"
chartCategoricalColors = ["#5DB0CF", "#8EA1AE", "#E5414D", "#EE8A3A", "#4DA67E", "#D9B444"]

[theme.dark.sidebar]
backgroundColor = "#0A131A"
secondaryBackgroundColor = "#14222C"
