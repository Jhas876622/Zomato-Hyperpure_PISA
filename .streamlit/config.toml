# PISA "cold-room desk" theme — frosted light.
# Hyperpure red is the brand + interaction color; in charts it only ever means "critical".
# Light only: app.py pins THEME = "light", so its HTML/CSS colours match only this palette.
# Adding a [theme.dark] section here would put dark-mode viewers' text on a dark background.

[theme]
base = "light"
primaryColor = "#CB202D"
backgroundColor = "#F2F5F7"
secondaryBackgroundColor = "#E4EAEE"
textColor = "#142029"
borderColor = "#D3DCE2"
baseRadius = "small"
showSidebarBorder = true
font = "sans-serif"

[client]
# Visitors see a generic error, not stack traces with file paths; full details stay in the server log.
showErrorDetails = "none"

[server]
enableXsrfProtection = true
enableCORS = true
